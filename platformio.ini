[platformio]
default_envs = esp32s3_supermini

[env:esp32s3_supermini]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 2031616
board_build.partitions = partitions/ota_4mb.csv
board_build.arduino.memory_type = qio_qspi
monitor_speed = 115200
upload_speed = 460800
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -Ithird_party/wttc
extra_scripts = pre:tools/embed_web.py
build_src_filter = +<*> -<simulator.cpp>
lib_deps =
  bblanchon/ArduinoJson@7.4.2

[env:simulator]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 2031616
board_build.arduino.memory_type = qio_qspi
board_build.partitions = partitions/ota_4mb.csv
build_src_filter = -<*> +<simulator.cpp>
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -Ithird_party/wttc
monitor_speed = 115200
